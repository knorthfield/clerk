name: Clerk
options:
  bundleIdPrefix: com.krisnorthfield
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_HARDENED_RUNTIME: YES
    # Apple Silicon only. Support: the current macOS and the one before it (now 27 and 26).
    ARCHS: arm64
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.18.3
targets:
  Clerk:
    type: application
    platform: macOS
    sources:
      - Clerk
    dependencies:
      - package: FluidAudio
    info:
      path: Clerk/Info.plist
      properties:
        CFBundleDisplayName: Clerk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Clerk records your side of the meeting and turns it into a transcript.
        NSAudioCaptureUsageDescription: Clerk records the other people in your meeting and turns what they say into a transcript.
    entitlements:
      path: Clerk/Clerk.entitlements
      properties:
        com.apple.security.device.audio-input: true
  ClerkTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ClerkTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Clerk
schemes:
  Clerk:
    build:
      targets:
        Clerk: all
    test:
      targets:
        - ClerkTests
